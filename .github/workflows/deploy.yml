name: Deploy Tiny d10 site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so Quartz can read git dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Fetch the ATLAS app from td10rpg/atlas
        run: |
          rm -rf quartz/static/tools/atlas atlas-src
          git clone --depth 1 https://github.com/td10rpg/atlas.git atlas-src
          mkdir -p quartz/static/tools/atlas
          cp atlas-src/*.js atlas-src/*.html atlas-src/*.css quartz/static/tools/atlas/
          rm -rf atlas-src
          echo "ATLAS files:" && ls quartz/static/tools/atlas
      - name: Build Quartz
        run: npx quartz build
      - name: Add CNAME for custom domain
        # TODO: switch to td10.org once DNS is ready (waiting on registrar support)
        run: echo "td10.org" > public/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
